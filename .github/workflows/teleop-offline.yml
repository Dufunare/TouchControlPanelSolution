name: Teleop Offline Tests
on:
  push:
    branches: [feat/teleop-6dof-calibration-safe-movl]
  pull_request:
    paths:
      - 'shared/TeleopGeometry.h'
      - 'shared/RelayV2Frame.h'
      - 'tests/*'
      - 'shared/RobotTelemetry.h'
      - 'shared/MultiPointCalibration.h'
      - 'shared/HapticCalibrationPolicy.h'
      - 'shared/DisplayOrigin.h'
      - '.github/workflows/teleop-offline.yml'
jobs:
  cpp17-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build geometry test
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/teleop_geometry_tests.cpp -o /tmp/teleop_geometry_test
      - name: Build protocol test
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/relay_v2_frame_tests.cpp -o /tmp/relay_v2_test
      - name: Build telemetry gate test
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/robot_telemetry_tests.cpp -o /tmp/telemetry_test
      - name: Build multi-point fit test
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/multipoint_calibration_tests.cpp -o /tmp/multipoint_test
      - name: Build haptic scheduler phase test
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/haptic_calibration_policy_tests.cpp -o /tmp/haptic_policy_test
      - name: Build GL display origin test
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/display_origin_tests.cpp -o /tmp/display_origin_test
      - name: Run tests
        run: |
          /tmp/teleop_geometry_test
          /tmp/relay_v2_test
          /tmp/telemetry_test
          /tmp/multipoint_test
          /tmp/haptic_policy_test
          /tmp/display_origin_test
